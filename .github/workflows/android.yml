name: Android checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android platform
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Test, build, and lint
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:testPlayDebugUnitTest :app:build :app:lint
      - name: Build standalone helper
        run: ./scripts/build-helper.sh
      - name: Verify optimized privileged entry points
        run: |
          release_apk=$(find app/build/outputs/apk/github/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$release_apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages "$release_apk" > "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.core.AdbHelper' "$RUNNER_TEMP/dex-packages.txt"
          grep -q 'com.hilight.studio.HiLightUserService' "$RUNNER_TEMP/dex-packages.txt"
      - name: Verify the Play build carries no network permission
        run: |
          play_apk=$(find app/build/outputs/apk/play/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$play_apk"
          perms="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$perms" manifest permissions "$play_apk" > "$RUNNER_TEMP/play-permissions.txt"
          # Play forbids an app it distributes from updating itself elsewhere, so the flavour that
          # goes there has neither the update check nor the permission serving it. Asserted here
          # because a merged manifest is easy to break by accident and the failure is a policy one.
          ! grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/play-permissions.txt"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' "$RUNNER_TEMP/play-permissions.txt"
