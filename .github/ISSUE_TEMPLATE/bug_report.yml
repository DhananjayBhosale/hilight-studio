name: Bug report
description: Report a reproducible problem with HiLight Studio.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include notification contents, personal data, or security vulnerabilities."
  - type: input
    id: device
    attributes:
      label: Pixel model
      placeholder: Pixel 11 Pro / Pro XL / Pro Fold
    validations:
      required: true
  - type: input
    id: android-build
    attributes:
      label: Android build
      placeholder: Android 17 build number
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Renderer transport
      options: [Root, Shizuku, ADB]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs or screenshots only after removing notification contents and personal data.
  - type: textarea
    id: led-diagnostics
    attributes:
      label: LED diagnostics, if relevant
      description: For a stuck or dark LED, use Setup > Copy LED diagnostics before rebooting or restarting the renderer, then paste it here. It contains allowlisted software state only and does not prove what the physical LED displayed.
      render: json
  - type: input
    id: privacy-activity
    attributes:
      label: Privacy activity rule, if relevant
      description: Say whether this involved microphone or camera activity and whether the rule was for any app or one app. Do not include personal data.
